<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Stencil Component Starter</title>
    <script type="module" src="/build/blackwall.esm.js"></script>
    <script nomodule src="/build/blackwall.js"></script>
    <style>
      *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .card-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
    </style>
  </head>
  <body>
    <bw-nav></bw-nav>

        <bw-card populate="true"></bw-card>

        <bw-card populate="true"></bw-card>
        <bw-card populate="true"></bw-card>
        <bw-card populate="true"></bw-card>
        <bw-card populate="true"></bw-card>
    </bw-container> -->
    <bw-container pd="2rem">
      <bw-container pd="2rem" primary="true">
        <bw-input label="Name" size="1.4rem" label-size="1.6rem"  box-mg-v="1rem" label-bold="true"></bw-input>
        <bw-input type="email" label="Email" size="1.4rem" label-size="1.6rem" box-mg-v="1rem" label-bold="true"></bw-input>
        <bw-input  textarea="true" label="Bio" size="1.4rem" label-size="1.6rem" box-mg-v="1rem" label-bold="true"></bw-input>
        <bw-input type="password" label="Password" size="1.4rem" label-size="1.6rem" box-mg-v="1rem" label-bold="true"></bw-input>
        <bw-input type="password" label="Confirm Password" size="1.4rem" label-size="1.6rem" box-mg-v="1rem" label-bold="true"></bw-input>
        <bw-btn name="Submit"></bw-btn>
      </bw-container>
    </bw-container>
